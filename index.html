<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wealthline｜個人資產統計</title>
    <meta name="description" content="開源的個人資產統計工具：以 Google 帳號登入，所有資料只存在你自己的 Google Drive，自動換算匯率與報價，清楚呈現資產配置。Wealthline is a free, open-source personal asset tracker that stores your data only in your own Google Drive." />
    <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191613" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wealthline" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="Wealthline｜個人資產統計" />
    <meta property="og:description" content="資料只存在你自己的 Google Drive 的開源資產統計工具。" />

    <!-- A reload while signed in (or in local mode), or the return from Google's sign-in page, goes straight to the app: hide the prerendered sign-in page until the app takes over (main.tsx). -->
    <script>try{if(location.hash.indexOf('access_token=')>=0||sessionStorage.getItem('wealthline.token')||sessionStorage.getItem('we-wealth.token')||sessionStorage.getItem('wealthline.local.tab')||localStorage.getItem('wealthline.local.active'))document.documentElement.classList.add('restoring')}catch(e){}</script>
    <style>.restoring #root>.landing{visibility:hidden;animation:restoring-reveal 0s 6s forwards}@keyframes restoring-reveal{to{visibility:visible}}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
